<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Garden Explorer">
  <title>Garden Explorer</title>
  <rect width="512" height="512" rx="112" fill="#2F6B4F"/>
  <g transform="translate(96 96) scale(320)">
    <!-- Leaf: intersection of two circles, tips at (0,0) and (0.75,0.75). -->
    <path d="M0,0 A0.75,0.75 0 0 1 0.75,0.75 A0.75,0.75 0 0 1 0,0 Z" fill="#FFFFFF"/>
    <!-- Stem -->
    <path d="M0.02,0.02 L-0.10,0.14" stroke="#FFFFFF" stroke-width="0.028" stroke-linecap="round" fill="none"/>
    <!-- Warm accent highlight -->
    <circle cx="0.34" cy="0.34" r="0.075" fill="#E7B75B"/>
  </g>
</svg>
